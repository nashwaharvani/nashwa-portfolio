<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nashwa Portfolio - Personal Portfolio Mahasiswa Teknik Informatika">
  <title>Nashwa Portfolio | Design System Preview</title>
  <link rel="stylesheet" href="css/design-system.css">
</head>
<body>

  <!-- Floating Navigation Bar Baseline -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="#" class="navbar-brand">
        Nashwa<span class="navbar-brand-accent">.dev</span>
      </a>

      <nav>
        <ul class="navbar-links">
          <li><a href="#home" class="navbar-link active">Home</a></li>
          <li><a href="#about" class="navbar-link">About</a></li>
          <li><a href="#skills" class="navbar-link">Skills</a></li>
          <li><a href="#projects" class="navbar-link">Projects</a></li>
          <li><a href="#experience" class="navbar-link">Experience</a></li>
          <li><a href="#certificates" class="navbar-link">Certificates</a></li>
          <li><a href="#contact" class="navbar-link">Contact</a></li>
        </ul>
      </nav>

      <div style="display: flex; gap: var(--space-xs); align-items: center;">
        <button class="btn btn-icon" id="themeToggle" aria-label="Toggle Theme">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-5.4-5.4c0-1.81 .89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/>
          </svg>
        </button>
        <a href="cv-nashwa.pdf" download class="btn btn-primary">CV Download</a>
      </div>
    </div>
  </header>

  <!-- Main Container Baseline -->
  <main id="main-content" style="padding-top: 90px; max-width: 1200px; margin: 0 auto; padding-left: var(--space-lg); padding-right: var(--space-lg);">
    <!-- Sections will be built modularly in subsequent steps -->
  </main>

  <script>
    // Simple theme switcher toggle logic
    const themeToggleBtn = document.getElementById('themeToggle');
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
    });
  </script>
</body>
</html>
